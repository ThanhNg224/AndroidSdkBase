[versions]
# --- Toolchain floor. Raising any of these is a compatibility decision: see docs/COMPATIBILITY.md.
agp = "9.4.1"
kotlin = "2.4.20"
# Kotlin metadata emitted to consumers. Compiling on newer Kotlin while emitting an older
# metadata version is what lets hosts on older Kotlin consume these AARs.
kotlinMetadataFloor = "2.2"
javaToolchain = "17"
compileSdk = "37"
minSdk = "24"
targetSdk = "37"

# --- Runtime libraries
coroutines = "1.11.0"
serialization = "1.11.0"
androidxAnnotation = "1.10.0"
androidxLifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"

# --- Test
junit = "4.13.2"
androidxJunit = "1.3.0"

# --- Build plugins
dokka = "2.2.0"
mavenPublish = "0.37.0"
dependencyAnalysis = "3.19.2"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }

# Referenced from build-logic's own build file so the convention plugins can compile
# against the AGP and Kotlin Gradle APIs.
agp-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
mavenpublish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }
# The ABI engine KGP itself uses; driven directly because KGP's abiValidation skips Android modules.
abi-tools = { module = "org.jetbrains.kotlin:abi-tools", version.ref = "kotlin" }
abi-tools-api = { module = "org.jetbrains.kotlin:abi-tools-api", version.ref = "kotlin" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
