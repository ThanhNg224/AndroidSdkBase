name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      initializer_build:
        description: Build/check the renamed initializer clone
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job owns its checkout, build outputs and local Maven repository.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Python for initializer checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Test initializer tooling
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' --verbose

      - name: Smoke test initializer on a Git archive clone
        run: python3 scripts/smoke_init_project.py

      - name: Build/check initialized archive clone (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.initializer_build
        run: python3 scripts/smoke_init_project.py --build

      - name: Unit tests, lint, ABI and formatting
        run: ./gradlew check -Psdkbase.warningsAsErrors=true
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-check
          path: '**/build/reports/**'

  publication-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publication and floor compiler consumers
        run: ./scripts/verify-publication.sh
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-publication-floor
          path: '**/build/reports/**'

  publication-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publication and current compiler consumers
        run: ./scripts/verify-publication.sh --current
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-publication-current
          path: '**/build/reports/**'

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Composition and optional adapter integration
        run: ./scripts/verify-integration.sh
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-integration
          path: '**/build/reports/**'

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Every guard still fails on a real violation
        run: ./scripts/verify-guards.sh
      - name: Upload guard logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guard-logs
          path: build/guard-logs/
