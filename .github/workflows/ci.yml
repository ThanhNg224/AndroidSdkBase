name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 17 matches this project's actual JDK toolchain floor (see docs/COMPATIBILITY.md), not an
      # arbitrary "latest LTS" choice — it both runs Gradle and satisfies every module's
      # `jvmToolchain(17)`, so the foojay toolchain resolver has nothing extra to provision.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble every module
        run: ./gradlew assembleRelease -Psdkbase.warningsAsErrors=true

      - name: Unit tests, lint and ABI check
        run: ./gradlew check -Psdkbase.warningsAsErrors=true

      # scripts/verify-publication.sh resolves the Android SDK itself: it reads ANDROID_HOME if
      # already set, else `sdk.dir` from a (gitignored, machine-local) local.properties, else
      # ~/Library/Android/sdk. GitHub's ubuntu-latest runner image ships an Android SDK with
      # ANDROID_HOME already exported, so no explicit SDK setup step is needed here — but that is
      # an environment assumption, not something this workflow configures, so if a future runner
      # image drops it, this step (and not the script) is what needs an `ANDROID_HOME: ...` env
      # entry or an SDK-setup action added.
      - name: Verify the publication and the external consumer
        run: ./scripts/verify-publication.sh

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/**'
