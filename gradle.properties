# --- Coordinates
sdkbase.group=io.github.thanhng224
sdkbase.version=0.1.0-SNAPSHOT

# POM metadata. rename-project.sh rewrites these for a new SDK.
sdkbase.pom.url=https://github.com/ThanhNg224/AndroidSdkBase
sdkbase.pom.developerId=thanhng224
sdkbase.pom.developerName=Nguyen Phuc Thanh
sdkbase.pom.developerUrl=https://github.com/ThanhNg224
sdkbase.pom.inceptionYear=2026

# --- Build performance. This is a small build today but a template for larger ones.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# --- Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# --- Kotlin
kotlin.code.style=official
kotlin.incremental=true
# Published artifacts must not pull the compiler's kotlin-stdlib (2.4.x) onto hosts on the floor.
kotlin.stdlib.default.dependency=false

# --- CI turns this on; locally a warning should not block you.
sdkbase.warningsAsErrors=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
